<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- road -->
  <line x1="8" y1="112" x2="632" y2="112" stroke-width="1" opacity="0.45"/>
  <line x1="8" y1="116" x2="632" y2="116" stroke-width="1" opacity="0.2" stroke-dasharray="4 6"/>

  <!-- lead escort -->
  <g transform="translate(24,88)">
    <path d="M4 16 C4 16 6 4 16 4 H36 C44 4 48 10 50 16 V22 H4 Z"/>
    <circle cx="14" cy="22" r="5.5"/>
    <circle cx="40" cy="22" r="5.5"/>
    <path d="M18 4 V10 H34 V4" opacity="0.7"/>
  </g>

  <!-- tractor -->
  <g transform="translate(120,62)">
    <path d="M8 38 V18 C8 10 14 6 22 6 H48 V38 Z"/>
    <path d="M48 18 H86 V38 H48"/>
    <path d="M14 6 V18 H40 V6" opacity="0.75"/>
    <rect x="54" y="22" width="14" height="8" opacity="0.5"/>
    <circle cx="24" cy="40" r="7"/>
    <circle cx="72" cy="40" r="7"/>
    <circle cx="24" cy="40" r="3" opacity="0.5"/>
    <circle cx="72" cy="40" r="3" opacity="0.5"/>
  </g>

  <!-- gooseneck + low loader -->
  <g transform="translate(206,78)">
    <path d="M0 22 V10 H18 V22"/>
    <path d="M18 22 V28 H300 V22 H18"/>
    <path d="M18 22 H300" />
    <!-- deck beam -->
    <path d="M18 28 H300" opacity="0.5"/>
    <!-- wheels groups -->
    <circle cx="70" cy="32" r="6"/>
    <circle cx="86" cy="32" r="6"/>
    <circle cx="102" cy="32" r="6"/>
    <circle cx="230" cy="32" r="6"/>
    <circle cx="246" cy="32" r="6"/>
    <circle cx="262" cy="32" r="6"/>
    <circle cx="278" cy="32" r="6"/>
  </g>

  <!-- oversize load (transformer / crate) -->
  <g transform="translate(250,28)">
    <path d="M8 68 V24 H28 V10 H150 V24 H196 V68 Z"/>
    <path d="M28 24 H150 V68" opacity="0.45"/>
    <!-- lifting lugs / bushings -->
    <circle cx="50" cy="18" r="5"/>
    <circle cx="128" cy="18" r="5"/>
    <path d="M50 10 V4"/>
    <path d="M128 10 V4"/>
    <!-- oversize marker flag, front -->
    <path d="M-6 20 H8" opacity="0.8"/>
    <path d="M-6 20 L-6 8 L4 14 Z" opacity="0.8"/>
  </g>

  <!-- rear escort -->
  <g transform="translate(560,88)">
    <path d="M4 16 C4 16 6 4 16 4 H36 C44 4 48 10 50 16 V22 H4 Z"/>
    <circle cx="14" cy="22" r="5.5"/>
    <circle cx="40" cy="22" r="5.5"/>
    <path d="M18 4 V10 H34 V4" opacity="0.7"/>
  </g>
</svg>
